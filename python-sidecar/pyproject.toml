[project]
name = "bridge-ai-brain"
version = "0.2.0"
description = "AI Sidecar for Bridge Research App"
requires-python = ">=3.12"
dependencies = [
    "dspy-ai>=3.1.2",
    "fastapi>=0.109.0",
    "keyring>=25.7.0",
    "pydantic-settings>=2.12.0",
    "pymupdf-layout>=1.26.6",
    "pymupdf4llm>=0.2.9",
    "requests>=2.32.5",
    "sqlmodel>=0.0.31",
    "tiktoken>=0.12.0",
    "tokenizers>=0.22.2",
    "uvicorn>=0.27.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.3.0"
]
